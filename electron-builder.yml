appId: com.nexus.leaguecontrol
productName: Nexus
copyright: Copyright (c) Nexus

directories:
  output: dist
  buildResources: build

# Only the bundled output ships: no sources, no tests, no .env, no node_modules (the main
# process uses Node/Electron built-ins only; React & co. are bundled into the renderer).
files:
  - out/**
  - package.json
asar: true
npmRebuild: false
electronLanguages:
  - en-US

# Harden the packaged Electron binary itself.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # The build is unsigned (no certificate): Windows SmartScreen shows an "unknown publisher" warning.

nsis:
  artifactName: Nexus-Setup-${version}-x64.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Nexus
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  deleteAppDataOnUninstall: false

portable:
  artifactName: Nexus-Portable-${version}-x64.${ext}
